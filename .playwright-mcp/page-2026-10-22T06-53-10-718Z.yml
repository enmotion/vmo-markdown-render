            - text: "#"
        - paragraph [ref=e225]:
          - text: 所有规则独立匹配同一份原始节点文本，再按起点从左到右处理；同起点按数组顺序优先，
          - strong [ref=e226]: 不是最长匹配优先
          - text: 。已消费区间内的后续候选会被跳过。
        - paragraph [ref=e227]:
          - text: 例如输入
          - code [ref=e228]: ORDER-42 USER-alice
          - text: ：
        - generic [ref=e229]:
          - button "Copy Code" [ref=e230] [cursor=pointer]
          - generic [ref=e231]: ts
          - code [ref=e233]:
            - generic [ref=e234]: "const textRules: TextRule[] = ["
