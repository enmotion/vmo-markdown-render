            - generic [ref=e239]: // 结果：订单 用户
        - paragraph [ref=e240]: 前两条同起点，首条胜出；第三条在后续位置命中。输出不会继续被其他规则处理。
        - paragraph [ref=e241]:
          - text: 引擎克隆正则、移除
          - code [ref=e242]: g/y
          - text: 后添加
          - code [ref=e243]: g
          - text: ，不修改调用方
          - code [ref=e244]: lastIndex
          - text: 。即使不写
          - code [ref=e245]: g
          - text: 也会匹配当前节点内的多个位置；
          - code [ref=e246]: "y"
          - text: 不提供粘连匹配语义；其他 flags 保留。
        - heading [level=2] [ref=e247]:
          - text: 匹配范围
          - link "Permalink to \"匹配范围\"" [ref=e248] [cursor=pointer]:
            - /url: "#匹配范围"
            - text: "#"
        - paragraph [ref=e249]: 规则适用于正文，包括标题、列表、表格和链接显示文本；跳过行内代码、代码块、公式、链接 URL、图片属性、组件属性与组件插槽正文。不跨 Markdown 文本节点匹配。
        - paragraph [ref=e250]:
          - text: 例如
          - code [ref=e251]: ORDER-**42**
          - text: 被拆为不同节点，
          - code [ref=e252]: /ORDER-42/
          - text: 不会命中；
          - code [ref=e253]: "[ORDER-42](https://example.com/ORDER-42)"
          - text: 只替换显示文本，不改 URL。用于目录的标题信息来自解析结果，不会因正则替换而同步改名。
        - paragraph [ref=e254]:
          - text: 流式期间无法推断任意正则的完成条件。
          - code [ref=e255]: /ORDER-\d+/
          - text: 在仅收到
          - code [ref=e256]: ORDER-4
          - text: 时就可能挂载组件，后续变成
          - code [ref=e257]: ORDER-42
          - text: 会更新 props；需要等完整标识再触发业务行为时，应设计明确结束符，例如
          - code [ref=e258]: /\[order:(\d+)\]/g
          - text: ，输入
          - code [ref=e259]: "[order:42]"
          - text: 。
        - heading [level=2] [ref=e260]:
          - text: 错误与处理上限
          - link "Permalink to \"错误与处理上限\"" [ref=e261] [cursor=pointer]:
            - /url: "#错误与处理上限"
            - text: "#"
        - list [ref=e262]:
          - listitem [ref=e263]:
            - text: 零长度命中会报告
            - code [ref=e264]: text-rule
            - text: 错误并停止当前规则的后续扫描；此前已收集的有效候选仍可参与处理。
          - listitem [ref=e265]: 无效正则或匹配执行失败会报告错误，其他规则继续处理。
          - listitem [ref=e266]:
            - text: 替换或 props 回调抛错时保留该次原文，并报告对应的零起始
            - code [ref=e267]: ruleIndex
            - text: 。
          - listitem [ref=e268]: 单节点超过 100,000 字符、规则超过 100 条，或候选超过 10,000 个时，该节点保留原文并报告错误。候选数量在消除重叠前计算。
        - paragraph [ref=e269]: 这些上限不能阻止正则本身的灾难性回溯。规则由宿主代码配置，避免将未经控制的复杂正则直接用于长文本。
